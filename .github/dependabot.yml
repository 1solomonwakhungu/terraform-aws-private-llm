version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /
      - /examples/simple
      - /examples/complete
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
